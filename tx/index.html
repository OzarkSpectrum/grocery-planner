<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grocery Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1d6a4d">
<style>
/* Pine green on cool paper, burnt orange only for sale tags. One column, thumb-reach tabs at the bottom. System fonts so it works offline. */
:root{
  --paper:#f4f6f1; --card:#ffffff; --ink:#17211c; --muted:#5b6a61; --line:#d8dfd7;
  --accent:#1d6a4d; --accent-ink:#ffffff; --tint:#e4efe8; --sale:#b5400f; --warn:#a35a00; --bad:#b3261e;
  --display:"Avenir Next","Trebuchet MS",system-ui,-apple-system,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#111815; --card:#19221d; --ink:#e6eee8; --muted:#9aab9f; --line:#2b3830;
    --accent:#5cbf96; --accent-ink:#0a1510; --tint:#1f3128; --sale:#ff9b5e; --warn:#f0b35a; --bad:#ff8a80;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)) 0}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 10px}
h1{font:700 26px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.sync{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--card)}
.sync.ok{color:var(--accent);border-color:var(--accent)}
h2{font:700 18px/1.2 var(--display);margin:0 0 8px}
h3{font:700 13px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}
.big{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:var(--tint);overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over>i{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
button,select,input,textarea{font:inherit;color:inherit}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.warn{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.mini{min-height:32px;padding:2px 12px;font-size:13px;border-radius:9px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select,input[type=text],input[type=number]{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;font-size:16px;max-width:100%}
select{width:100%}
.day{padding:12px 14px}
.day .dn{font:700 15px var(--display);margin-bottom:6px}
.day label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;letter-spacing:.04em;text-transform:uppercase}
.item{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}
.item .nm{flex:1;min-width:0}
.item .n{font-weight:500}
.item.done .n{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.meta select{width:auto;min-height:32px;padding:2px 6px;font-size:13px;border-radius:8px}
.amt{width:84px;text-align:right}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;border:1px solid var(--line);color:var(--muted)}
.tag.sale{color:var(--sale);border-color:var(--sale)}
.tag.you{color:var(--accent);border-color:var(--accent)}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px}
.grp b{font:700 17px var(--display)}
.pb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.pb th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 4px}
.pb td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.pb input{width:100%;min-width:0;padding:6px 6px;min-height:40px;text-align:right}
.pb .pn{font-weight:500;line-height:1.25}
.pb select{min-height:30px;font-size:12px;padding:1px 4px;margin-top:3px;width:auto}
textarea{width:100%;min-height:150px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px;font:14px/1.4 var(--body)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav button{border:0;background:transparent;border-radius:10px;min-height:48px;font-size:13px;font-weight:500;padding:0 2px;color:var(--muted);cursor:pointer}
nav button[aria-current="page"]{background:var(--tint);color:var(--accent);font-weight:700}
.empty{color:var(--muted);padding:6px 0}
.sale-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.sale-line b{color:var(--sale);font-variant-numeric:tabular-nums}
details.fam{border-top:1px solid var(--line);padding:10px 0}
details.fam:first-of-type{border-top:0}
details.fam summary{cursor:pointer;list-style:none}
details.fam summary::-webkit-details-marker{display:none}
details.fam ul,details.fam ol{margin:6px 0 6px 20px;padding:0}
details.fam li{margin:3px 0}
.ings{max-height:280px;overflow:auto;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;margin:6px 0}
.ings .item{padding:6px 0}
.mrow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.err{color:var(--bad);font-size:14px;margin-top:6px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .25s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Grocery Planner</h1>
      <div class="sub">Mon to Fri lunches and dinners, one person</div>
    </div>
    <span id="sync" class="sync" role="status">Online</span>
  </header>
  <main id="view"></main>
</div>
<nav aria-label="Sections"><div class="in" id="nav"></div></nav>

const abc = (a, b) => String(a).localeCompare(String(b), undefined, {sensitivity:"base"});

function defaults(){
  return {v:2, updatedAt:0, budget:40, pref:"heb", stores:DEFAULT_STORES.slice(), threshold:0.5,

    prices:{}, overrides:{}, checked:{}, actual:{}, extras:[], custom:[], last:[], edits:{}, hidden:[], myItems:[], famSeen:[], famList:[], famPlan:new Array(5).fill(null)};

let state = defaults();
function normalize(s){
  const o = Object.assign(defaults(), s || {});
  o.meats = Object.assign(defaults().meats, o.meats || {});
  ["pantry","prices","overrides","checked","actual","edits"].forEach(k => { if (!o[k] || typeof o[k] !== "object" || Array.isArray(o[k])) o[k] = {}; });
  ["extras","custom","last","hidden","myItems","famSeen","famList"].forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });
  const known = id => !!RECIPE_BY[id] || o.custom.some(r => r && r.id === id) || famPool().some(r => r.id === id);
  o.plan = (Array.isArray(o.plan) && o.plan.length === 10) ? o.plan.map(x => known(x) ? x : null) : new Array(10).fill(null);
  o.famPlan = (Array.isArray(o.famPlan) && o.famPlan.length === 5) ? o.famPlan.map(x => typeof x === "string" ? x : null) : new Array(5).fill(null);
  o.myItems = o.myItems.filter(i => i && i.id && i.name && CATS.includes(i.cat) && typeof i.est === "number");
  syncStores(o);
  if (typeof o.budget !== "number" || !(o.budget >= 0)) o.budget = 40;
  if (typeof o.threshold !== "number" || !(o.threshold >= 0)) o.threshold = 0.5;
  return o;
}
function applyData(d){
  setData(d);
  ads = normalizeAds(d.ads);
  curVersion = d.version || 0;
  dataUpdated = d.updated || null;
  if (state && state.plan) state.plan = state.plan.map(x => (x && recipeById(x)) ? x : null);
}

const round2 = n => Math.round(n * 100) / 100;
const money = n => "$" + (Number.isFinite(n) ? n : 0).toFixed(2);

function adPrice(id, store){
  let best = null;
  for (const a of (ads.items || [])) {
    if (a && a.itemId === id && a.store === store && typeof a.price === "number" && a.price >= 0) {
      if (best === null || a.price < best) best = a.price;
    }
  }
  return best;
}
function priceFor(id, store){
  const it = ITEM_BY[id];
  const sale = adPrice(id, store);
  const lg = (state.prices[id] || {})[store];
  const logged = (typeof lg === "number" && lg > 0) ? lg : null;
  if (sale !== null && (logged === null || sale <= logged)) return {price:sale, kind:"sale"};
  if (logged !== null) return {price:logged, kind:"logged"};
  return {price:it.est, kind:"est"};
}
/* The preferred store wins unless another store is proven cheaper by more than the threshold
   (a logged price, or a sale), and the preferred price is a real one or the other is a sale. */
function bestStore(id){
  const ov = state.overrides[id];
  if (ov && STORE_KEYS.includes(ov)) return ov;
  let best = state.pref;
  const p = priceFor(id, best);
  let bestP = p.price;
  for (const s of STORE_KEYS) {
    if (s === state.pref) continue;
    const q = priceFor(id, s);
    if (q.kind !== "est" && q.price + state.threshold < bestP && (p.kind !== "est" || q.kind === "sale")) {
      best = s; bestP = q.price;
    }
  }
  return best;
}
const itemCost = id => priceFor(id, bestStore(id)).price;

function famListRecipes(){ const l = (state.famList || []).concat((state.famPlan || []).filter(Boolean)); const seen = new Set(); return (FAMILY.recipes || []).filter(r => l.includes(r.id) && !seen.has(r.id) && seen.add(r.id)); }
function planIds(){
  const s = new Set();
  state.plan.forEach(rid => { const r = rid && recipeById(rid); if (r) rItems(r).forEach(i => s.add(i)); });
  famListRecipes().forEach(r => (r.items || []).forEach(i => { if (ITEM_BY[i]) s.add(i); }));
  return s;
}
function neededIds(){ return [...planIds()].filter(i => !state.pantry[i]); }

function listEntries(){
  const out = neededIds().map(id => {
    const it = ITEM_BY[id]; const store = bestStore(id); const p = priceFor(id, store);
    return {id, name:it.name, unit:it.unit, cat:it.cat, store, price:p.price, kind:p.kind};
  });
  state.extras.forEach(x => out.push({id:x.id, name:x.name, unit:"", cat:"Extras", store:x.store, price:x.price, kind:"extra", extra:true}));
  const ci = c => { const i = CATS.indexOf(c); return i < 0 ? 99 : i; };
  out.sort((a, b) => (ci(a.cat) - ci(b.cat)) || a.name.localeCompare(b.name));
  return out;
}
function totals(){
  const e = listEntries();
  const planned = round2(e.reduce((s, x) => s + x.price, 0));
  let spent = 0, anyActual = false;
  e.forEach(x => { const a = state.actual[x.id]; if (typeof a === "number") { spent += a; anyActual = true; } });
  return {planned, spent:round2(spent), anyActual, count:e.length};
}

/* Fill the week. Each toggled meat gets one meal; everything else is vegetarian, chosen by lowest added cost,
   with a penalty for repeats and for last week's meals, plus a little randomness so weeks differ. */
function fillPlan(replaceForMeat, shuffle, pantryOnly){
  const rnd = shuffle ? 2.5 : 1.0;
  state.plan = state.plan.map(rid => { const r = rid && recipeById(rid); return (r && r.meat && !state.meats[r.meat]) ? null : (r ? rid : null); });
  const uses = {};
  state.plan.forEach(r => { if (r) uses[r] = (uses[r] || 0) + 1; });
  const jit = {}; allRecipes().forEach(r => { jit[r.id] = Math.random() * rnd; });
  const last = new Set(state.last || []);
  const need = new Set(neededIds());
  const marg = r => rItems(r).reduce((s, id) => (state.pantry[id] || need.has(id)) ? s : s + itemCost(id), 0)
    + (uses[r.id] || 0) * 2 + (last.has(r.id) ? 2 : 0) + (jit[r.id] || 0);
  const take = (slot, r) => { state.plan[slot] = r.id; uses[r.id] = (uses[r.id] || 0) + 1; rItems(r).forEach(id => { if (!state.pantry[id]) need.add(id); }); };
  const day = s => Math.floor(s / 2);
  const dinnerOrder = [7, 3, 9, 5, 1]; // Thu, Tue, Fri, Wed, Mon dinners
  const lunchOrder = [6, 4, 8, 2];
  const present = new Set(state.plan.map(r => r && recipeById(r)).filter(r => r && r.meat).map(r => r.meat));
  const recs = allRecipes().filter(r => !pantryOnly || (rItems(r).length > 0 && rItems(r).every(id => state.pantry[id])));
  for (const m of MEATS) {
    if (!state.meats[m] || present.has(m)) continue;
    let slot = dinnerOrder.find(s => state.plan[s] == null);
    let t = "dinner";
    if (slot === undefined && replaceForMeat) {
      slot = dinnerOrder.find(s => { const r = state.plan[s] && recipeById(state.plan[s]); return !r || !r.meat; });
    }
    if (slot === undefined) { slot = lunchOrder.find(s => state.plan[s] == null); t = "lunch"; }
    if (slot === undefined) continue;
    const pool = recs.filter(r => r.meat === m && fits(r, t) && (r.minDay || 0) <= day(slot));
    if (!pool.length) continue;
    pool.sort((a, b) => (marg(a) - marg(b)) || a.name.localeCompare(b.name));
    take(slot, pool[0]);
  }
  for (let s = 0; s < 10; s++) {
    if (state.plan[s] != null) continue;
    const t = s % 2 === 0 ? "lunch" : "dinner";
    const c = recs.filter(r => fits(r, t) && !r.meat && (uses[r.id] || 0) < 2 && (r.minDay || 0) <= day(s));
    if (!c.length) continue;
    c.sort((a, b) => (marg(a) - marg(b)) || a.name.localeCompare(b.name));
    take(s, c[0]);
  }
}
</script>

<script>

function loadLocal(){

}

}

function storeOptions(sel){ return STORE_KEYS.map(s => `<option value="${s}"${s === sel ? " selected" : ""}>${STORES[s]}</option>`).join(""); }

}
function slotSelect(i){
  const t = i % 2 === 0 ? "lunch" : "dinner"; const d = Math.floor(i / 2); const cur = state.plan[i];
  const opts = allRecipes().filter(r => fits(r, t) && (r.minDay || 0) <= d && (!r.meat || state.meats[r.meat] || r.id === cur));

    opts.map(r => `<option value="${esc(r.id)}"${r.id === cur ? " selected" : ""}>${esc(r.name)}</option>`).join("") + `</select>`;
}
function viewPlan(){
  const t = totals(); const left = round2(state.budget - t.planned); const over = left < 0;
  const pct = state.budget > 0 ? Math.min(100, t.planned / state.budget * 100) : 100;
  const veg = MEATS.every(m => !state.meats[m]);
  let h = `<section class="card">
    <div class="row between"><div><div class="tiny muted">Groceries planned</div><div class="big">${money(t.planned)}</div></div>
    <div style="text-align:right"><div class="tiny muted">${over ? "Over budget by" : "Left of budget"}</div><div class="big" style="color:${over ? "var(--bad)" : "var(--accent)"}">${money(Math.abs(left))}</div></div></div>
    <div class="bar${over ? " over" : ""}"><i style="width:${pct}%"></i></div>
    <div class="row" style="gap:12px;margin-top:10px">
      <label class="small muted" for="budget">Weekly budget $</label>

    </div>

  </section>
  <section class="card">

    <div class="chips">${MEATS.map(m => `<button class="chip" data-act="meat" data-m="${m}" aria-pressed="${state.meats[m]}">${MEAT_LABEL[m]}</button>`).join("")}</div>
    <div class="row" style="margin-top:6px"><label class="small muted" for="pref">Shop first at</label>
      <select id="pref" data-act="pref" style="width:auto">${storeOptions(state.pref)}</select></div>
    <div class="btns"><button class="btn" data-act="fill">Fill empty meals</button><button class="btn ghost" data-act="shuffle">Shuffle all</button><button class="btn ghost" data-act="clear">Clear</button></div>
    <div class="btns" style="margin-top:8px"><button class="btn ghost" data-act="fillpantry">Use up my pantry</button></div>${ui.planMsg ? `<div class="small muted" style="margin-top:8px">${esc(ui.planMsg)}</div>` : ""}
  </section>`;
  for (let d = 0; d < 5; d++) {
    h += `<section class="card day"><div class="dn">${DAYS[d]}</div>

}
function canMakeList(){
  const rows = [];

  allRecipes().forEach(r => { if (r.meat && !state.meats[r.meat]) return; const its = rItems(r); if (!its.length) return; seen.add(r.family ? r.id.slice(2) : r.id); rows.push({name:r.name, family:!!r.family, its}); });

  rows.forEach(r => { r.miss = r.its.filter(id => !state.pantry[id]).map(id => ITEM_BY[id].name); });

}
function canMakeCard(){
  if (!ui.canMake) return `<section class="card"><h2>What can I make?</h2><div class="small muted">See which meals you can make with what you have checked, and which are only one or two ingredients away.</div>
    <div class="btns"><button class="btn" data-act="cantoggle">Show me</button></div></section>`;
  const rows = canMakeList();
  const ready = rows.filter(r => !r.miss.length).sort((a, b) => abc(a.name, b.name));
  const near = rows.filter(r => r.miss.length >= 1 && r.miss.length <= 2).sort((a, b) => (a.miss.length - b.miss.length) || abc(a.name, b.name));
  const line = r => `<div class="mrow"><div><div style="font-weight:500">${esc(r.name)}${r.family ? ' <span class="tiny muted">Family</span>' : ""}</div>${r.miss.length ? `<div class="tiny muted">Need: ${esc(r.miss.join(", "))}</div>` : ""}</div></div>`;
  let h = `<section class="card"><div class="row" style="gap:10px"><h2 style="flex:1;margin:0">What can I make?</h2><button class="btn ghost mini" data-act="cantoggle">Hide</button></div>
    <div class="small muted" style="margin-top:6px">Based on what you have checked below. Meat meals only show when that meat is switched on in Plan.</div>`;
  h += `<h3>Ready now (${ready.length})</h3>` + (ready.length ? `<div style="padding:0 2px">${ready.map(line).join("")}</div>` : `<div class="small muted">Nothing yet. Check more items below.</div>`);
  h += `<h3>One or two items away (${near.length})</h3>` + (near.length ? `<div style="padding:0 2px">${near.slice(0, 20).map(line).join("")}</div>${near.length > 20 ? `<div class="tiny muted" style="margin-top:6px">Showing the closest 20.</div>` : ""}` : `<div class="small muted">Nothing close yet.</div>`);
  return h + `</section>`;
}
function viewPantry(){
  const used = planIds();
  const have = ITEMS.filter(i => state.pantry[i.id]).length;
  let h = `<section class="card"><h2>What I have on hand</h2>
    <div class="small muted">Switch on what is already in your kitchen. Those items drop off your shopping list and the planner favors meals that use them. ${have} on hand now.</div></section>
    ${canMakeCard()}
    <section class="card"><h2>Add something not on the list</h2>

    <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap"><input id="uname" type="text" placeholder="Item (kimchi, smoked paprika...)" style="flex:2;min-width:140px">
      <select id="ucat" style="flex:1;min-width:110px">${CATS.map(c => `<option value="${esc(c)}"${c === "Pantry" ? " selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
    <div class="row" style="gap:8px;margin-top:8px"><input id="uprice" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Price if I buy it (optional)" style="flex:1">

  });

}
function viewShop(){

          ${e.extra ? `<button class="btn ghost mini" data-act="delextra" data-id="${esc(e.id)}">Remove</button>` : ""}</div></div>

    ${ui.confirmNew ? `<div class="small muted" style="margin-top:8px">A new week clears the plan, checkmarks, prices paid, and extras, and switches the meat options off. Your pantry, price book, and meals stay.</div>` : ""}
  </section>`;
  return h;
}
function mealLine(r){
  const names = rItems(r).map(id => ITEM_BY[id].name.toLowerCase()).join(", ");
  const tag = r.type === "lunch" ? "Lunch" : r.type === "dinner" ? "Dinner" : "Lunch or dinner";
  return `<div class="mrow"><div><div style="font-weight:500">${esc(r.name)}</div><div class="tiny muted">${r.edited ? "Edited · " : ""}${r.family ? "Family · " : ""}${esc(tag)}${names ? " · " + esc(names) : ""}</div></div>` +
    `<div class="row" style="gap:6px">` + ((state.hidden || []).includes(r.id)

}
function mealForm(){
  const ed = ui.editId ? recipeById(ui.editId) : null;
  const sel = (v, cur) => v === cur ? " selected" : "";
  return `<section class="card"><h2>${ed ? "Edit meal" : "New meal"}</h2>
    <label class="small muted" for="mname">Name</label><input id="mname" type="text" placeholder="Rice and eggs" value="${ed ? esc(ed.name) : ""}" style="width:100%">
    <div class="row" style="gap:8px;margin-top:10px"><div style="flex:1"><label class="small muted" for="mtype">When</label>
      <select id="mtype"><option value="any"${sel("any", ed && ed.type)}>Lunch or dinner</option><option value="lunch"${sel("lunch", ed && ed.type)}>Lunch</option><option value="dinner"${sel("dinner", ed && ed.type)}>Dinner</option></select></div>
      <div style="flex:1"><label class="small muted" for="mmeat">Contains</label>
      <select id="mmeat"><option value="">No meat or fish</option>${MEATS.map(m => `<option value="${m}"${sel(m, ed && ed.meat)}>${MEAT_LABEL[m]}</option>`).join("")}</select></div></div>
    <div class="small muted" style="margin-top:10px">Ingredients</div>
    <div class="ings">${ITEMS.map(i => `<label class="item"><input type="checkbox" class="ing" value="${esc(i.id)}"${ed && ed.items.includes(i.id) ? " checked" : ""}><span class="n">${esc(i.name)}</span></label>`).join("")}</div>
    <div class="small muted">Missing an ingredient? Ask Claude to add it to the shared list.</div>
    ${ui.mealErr ? `<div class="err">${esc(ui.mealErr)}</div>` : ""}
    <div class="btns"><button class="btn" data-act="savemeal">Save meal</button><button class="btn ghost" data-act="cancelmeal">Cancel</button>

const LS_FAM = "grocery-planner-family";

function sortFam(d){ d.recipes.sort((a, b) => abc(a.title, b.title)); return d; }

function viewFamily(){

async function fetchFamily(){

function viewMeals(){
  const recs = allRecipesAll(), hid = state.hidden || [];

function daysAgo(dateStr){

  if (!m) return null;

  return Math.floor((Date.now() - then.getTime()) / 86400000);
}
function viewPrices(){

  h += `<section class="card"><h2>My stores</h2><div class="small muted">Check the stores you shop at. Prices for stores other than the ones in the weekly ads start as estimates; type in real prices in the price book below as you see them.</div>
    <div class="ings">${Object.keys(STORES).map(k => `<label class="item"><input type="checkbox" data-act="storetoggle" data-s="${k}"${STORE_KEYS.includes(k) ? " checked" : ""}><span class="n">${esc(STORES[k])}</span></label>`).join("")}</div></section>`;

  h += `<h3>Price book</h3><section class="card" style="padding:8px 10px"><table class="pb"><thead><tr><th style="width:34%">Item</th>${STORE_KEYS.map(s => `<th>${STORE_SHORT[s]}</th>`).join("")}</tr></thead><tbody>` +
    ITEMS.map(i => `<tr><td><div class="pn">${esc(i.name)}</div><div class="tiny muted">est. ${money(i.est)}</div>
      <select data-act="ovr" data-id="${esc(i.id)}" aria-label="Always buy ${esc(i.name)} at"><option value="">Auto</option>${STORE_KEYS.map(s => `<option value="${s}"${state.overrides[i.id] === s ? " selected" : ""}>${STORES[s]}</option>`).join("")}</select></td>` +

const VIEWS = {plan:viewPlan, pantry:viewPantry, shop:viewShop, meals:viewMeals, family:viewFamily, prices:viewPrices};
const TABS = [["plan","Plan"],["pantry","Pantry"],["shop","Shop"],["meals","Meals"],["family","Family"],["prices","Prices"]];
function render(){

  $("nav").innerHTML = TABS.map(t => `<button data-act="tab" data-tab="${t[0]}"${ui.tab === t[0] ? ' aria-current="page"' : ""}>${t[1]}${t[0] === "family" && ui.tab !== "family" && famUnseen().length ? " \u2022" : ""}</button>`).join("");

/* ---------- updates from the web ---------- */
async function fetchData(manual){
  try {
    const r = await fetch("../data.json", {cache:"no-store"});
    if (!r.ok) throw new Error("http " + r.status);
    const d = await r.json();
    if (!validData(d)) throw new Error("bad data");
    if ((d.version || 0) >= curVersion) {
      applyData(d);
      try { localStorage.setItem(LS_DATA, JSON.stringify(d)); } catch (e) {}
      if (state.plan.every(x => x == null)) fillPlan(true, false);
      ui.dataMsg = "Up to date.";
    }
  } catch (e) {
    if (manual) ui.dataMsg = "Could not reach updates. Using the saved copy.";
  }
  const a = document.activeElement;
  if (manual || !(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"))) render();
}

/* ---------- actions ---------- */
function parseMoney(v){
  const n = parseFloat(String(v).replace(/[^0-9.]/g, ""));
  return Number.isFinite(n) && n >= 0 ? round2(n) : null;
}
function listText(){
  const entries = listEntries();
  const order = [state.pref].concat(STORE_KEYS.filter(s => s !== state.pref));
  const parts = [];
  order.forEach(s => {
    const list = entries.filter(e => e.store === s);
    if (!list.length) return;
    parts.push(STORES[s] + " (" + money(round2(list.reduce((a, e) => a + e.price, 0))) + ")\n" + list.map(e => "[ ] " + e.name + (e.unit ? ", " + e.unit : "")).join("\n"));
  });

}
async function copyList(){
  const text = listText();

  ui.copyText = ok ? "" : text;
  if (ok) { const el = $("sync"); if (el) { el.textContent = "List copied"; el.className = "sync ok"; setTimeout(setStatus, 2000); } }
  render();
}
const CLICK_ACTS = new Set(["cantoggle","tab","meat","fill","shuffle","clear","copy","newweek","addextra","delextra","addmeal","savemeal","cancelmeal","removemeal","famlist","additem","delitem","fillpantry","editmeal","hidemeal","showmeal","resetmeal","checkdata"]);
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act; if (!CLICK_ACTS.has(a)) return;
  if (a !== "newweek" && ui.confirmNew) ui.confirmNew = false;
  if (a === "tab") { ui.tab = el.dataset.tab; ui.copyText = ""; ui.confirmNew = false; if (ui.tab === "family") ui.famFilter = ""; render(); window.scrollTo(0, 0); return; }
  if (a === "meat") { const m = el.dataset.m; state.meats[m] = !state.meats[m]; fillPlan(true, false); save(); render(); return; }
  if (a === "famlist") {
    const id = el.dataset.id, i = state.famList.indexOf(id);
    if (i >= 0) state.famList.splice(i, 1); else state.famList.push(id);
    save(); const o = document.querySelector('details.fam[data-id="' + id + '"]'); const open = o && o.open; render(); const n = document.querySelector('details.fam[data-id="' + id + '"]'); if (n && open) n.open = true; return;
  }
  if (a === "cantoggle") { ui.canMake = !ui.canMake; render(); return; }
  if (a === "additem") {
    const name = ($("uname").value || "").trim(); const pr = parseMoney($("uprice").value);
    if (!name) { ui.itemErr = "Give the item a name."; render(); return; }

  }

    ui.planMsg = n === 10 ? "All 10 meals come from what you have on hand." : n === 0 ? "No meals can be made from what you have on hand yet. Check more items in Pantry." : `${n} of 10 meals can be made from what you have. Add more to Pantry for more options.`;

  if (a === "showmeal") { state.hidden = state.hidden.filter(x => x !== el.dataset.id); save(); render(); return; }
  if (a === "resetmeal") { delete state.edits[ui.editId]; ui.addMeal = false; ui.editId = null; ui.mealErr = ""; save(); render(); return; }

document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act; if (CLICK_ACTS.has(a)) return;
  const id = el.dataset.id;
  if (a === "famslot") { state.famPlan[+el.dataset.i] = el.value || null; }
  else if (a === "slot") { state.plan[+el.dataset.i] = el.value || null; }
  else if (a === "pantry") { if (el.checked) state.pantry[id] = true; else delete state.pantry[id]; }
  else if (a === "check") { if (el.checked) state.checked[id] = true; else delete state.checked[id]; }
  else if (a === "budget") { const n = parseMoney(el.value); if (n !== null) state.budget = n; }
  else if (a === "famfilter") { ui.famFilter = el.value; }
  else if (a === "pref") { state.pref = el.value; }
  else if (a === "storetoggle") {
    const k = el.dataset.s, cur = state.stores.slice();
    const next = el.checked ? (cur.includes(k) ? cur : cur.concat(k)) : cur.filter(x => x !== k);
    state.stores = next; syncStores(state);
  }
  else if (a === "thr") { const n = parseMoney(el.value); if (n !== null) state.threshold = n; }
  else if (a === "ovr") { if (el.value) state.overrides[id] = el.value; else delete state.overrides[id]; }
  else if (a === "move") {
    const x = state.extras.find(q => q.id === id);
    if (x) x.store = el.value; else state.overrides[id] = el.value;
  }
  else if (a === "actual") {
    const n = parseMoney(el.value);
    if (n === null || el.value === "") { delete state.actual[id]; }
    else {
      state.actual[id] = n;
      const e = listEntries().find(q => q.id === id);
      if (e && !e.extra && n > 0) { state.prices[id] = Object.assign({}, state.prices[id], {[e.store]: n}); }
    }
  }
  else if (a === "price") {
    const n = parseMoney(el.value); const s = el.dataset.s;
    const cur = Object.assign({}, state.prices[id]);
    if (n === null || el.value === "" || n === 0) delete cur[s]; else cur[s] = n;
    if (Object.keys(cur).length) state.prices[id] = cur; else delete state.prices[id];
  }
  save(); render();
});

/* ---------- start ---------- */
(function init(){
  let data = EMBED;
  try {
    const s = JSON.parse(localStorage.getItem(LS_DATA) || "null");
    if (validData(s) && (s.version || 0) > (EMBED.version || 0)) data = s;
  } catch (e) {}
  setData(data); // so the saved state can be checked against real meals
  try { const f = JSON.parse(localStorage.getItem(LS_FAM) || "null"); if (validFam(f)) FAMILY = sortFam(f); } catch (e) {}
  const local = loadLocal();
  const firstRun = !local;
  state = local || defaults(); syncStores(state);
  applyData(data);
  if (state.plan.every(x => x == null)) { fillPlan(true, false); save(); }
  render(); setStatus();
  if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("../sw.js").catch(() => {}); } catch (e) {} }
  window.addEventListener("online", () => { setStatus(); fetchData(false); fetchFamily(); });
  window.addEventListener("offline", setStatus);
  fetchData(false);
  fetchFamily();
})();
